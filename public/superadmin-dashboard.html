<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaLeadAi — Superadmin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --bg-2: #18181b;
      --bg-3: #27272a;
      --border: #27272a;
      --border-subtle: #1f1f23;
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --purple: #6366f1;
      --purple-light: #818cf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --sidebar-w: 240px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--purple), #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg { width: 16px; height: 16px; color: #fff; stroke: currentColor; fill: none; stroke-width: 2; }

    .brand-name { font-size: 0.875rem; font-weight: 700; color: var(--text); }
    .brand-label {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 4px;
      padding: 2px 8px;
    }

    .sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }

    .nav-section-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 8px 10px 4px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.825rem;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 1px;
      border: none; background: none; width: 100%; text-align: left;
    }

    .nav-item:hover { background: var(--bg-3); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,0.12); color: var(--purple-light); }

    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
    }

    .admin-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      background: var(--bg-3);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .admin-avatar {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--purple), #8b5cf6);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .admin-info { min-width: 0; }
    .admin-email { font-size: 0.725rem; font-weight: 600; color: var(--text); truncate: clip; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-role { font-size: 0.62rem; color: var(--text-dim); }

    .btn-logout {
      width: 100%; padding: 8px;
      background: none; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer;
      color: var(--text-muted); font-size: 0.775rem; font-family: inherit;
      font-weight: 500; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    .btn-logout:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,0.05); }
    .btn-logout svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── MAIN CONTENT ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px;
      gap: 12px;
      position: sticky; top: 0;
      background: var(--bg);
      z-index: 50;
    }

    .topbar-title { font-size: 0.9rem; font-weight: 600; color: var(--text); flex: 1; }

    .topbar-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; color: var(--text-muted);
    }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .btn-refresh {
      background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-family: inherit;
      font-weight: 500; padding: 6px 12px; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }

    .btn-refresh:hover { color: var(--text); border-color: #3f3f46; }
    .btn-refresh svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform 0.4s; }
    .btn-refresh.spinning svg { transform: rotate(360deg); }

    /* ── PAGES ── */
    .page { display: none; padding: 24px; }
    .page.active { display: block; }

    /* ── STAT CARDS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: #3f3f46; }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 60px; height: 60px;
      border-radius: 0 0 0 60px;
      opacity: 0.06;
    }

    .stat-card.purple::after { background: var(--purple); }
    .stat-card.green::after { background: var(--green); }
    .stat-card.blue::after { background: var(--blue); }
    .stat-card.yellow::after { background: var(--yellow); }
    .stat-card.cyan::after { background: var(--cyan); }
    .stat-card.red::after { background: var(--red); }

    .stat-label { font-size: 0.72rem; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.04em; color: var(--text); line-height: 1; margin-bottom: 6px; }
    .stat-sub { font-size: 0.7rem; color: var(--text-dim); }

    .stat-icon {
      position: absolute; top: 16px; right: 16px;
      width: 28px; height: 28px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }

    .stat-icon.purple { background: rgba(99,102,241,0.12); color: var(--purple-light); }
    .stat-icon.green { background: rgba(34,197,94,0.1); color: var(--green); }
    .stat-icon.blue { background: rgba(59,130,246,0.1); color: var(--blue); }
    .stat-icon.yellow { background: rgba(245,158,11,0.1); color: var(--yellow); }
    .stat-icon.cyan { background: rgba(6,182,212,0.1); color: var(--cyan); }
    .stat-icon.red { background: rgba(239,68,68,0.1); color: var(--red); }
    .stat-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title { font-size: 0.875rem; font-weight: 600; color: var(--text); }
    .section-count { font-size: 0.72rem; color: var(--text-muted); background: var(--bg-3); padding: 2px 8px; border-radius: 4px; }

    /* ── PLAN BAR ── */
    .plan-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }

    .plan-card {
      background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px;
    }

    .plan-name { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }
    .plan-count { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; }
    .plan-card.free .plan-count { color: var(--text-muted); }
    .plan-card.pro .plan-count { color: var(--purple-light); }
    .plan-card.custom .plan-count { color: var(--yellow); }

    .plan-bar-wrap { margin-top: 8px; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
    .plan-bar { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
    .plan-card.free .plan-bar { background: var(--text-dim); }
    .plan-card.pro .plan-bar { background: var(--purple); }
    .plan-card.custom .plan-bar { background: var(--yellow); }

    /* ── TABLE ── */
    .table-wrap {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .table-toolbar {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }

    .search-box {
      flex: 1; max-width: 300px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
      color: var(--text); font-size: 0.8rem; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }

    .search-box::placeholder { color: var(--text-dim); }
    .search-box:focus { border-color: var(--purple); }

    .toolbar-right { display: flex; gap: 8px; margin-left: auto; align-items: center; }

    .page-info { font-size: 0.72rem; color: var(--text-muted); }

    .btn-sm {
      background: var(--bg-3); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-family: inherit;
      font-weight: 500; padding: 6px 12px; transition: all 0.15s;
    }

    .btn-sm:hover:not(:disabled) { color: var(--text); border-color: #3f3f46; }
    .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm.primary { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.3); color: var(--purple-light); }
    .btn-sm.primary:hover { background: rgba(99,102,241,0.18); }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      text-align: left; padding: 10px 16px;
      font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    td { padding: 11px 16px; font-size: 0.8rem; color: var(--text); vertical-align: middle; }

    .user-cell { display: flex; align-items: center; gap: 10px; }

    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .user-name { font-weight: 500; font-size: 0.8rem; }
    .user-email { font-size: 0.7rem; color: var(--text-muted); }

    .badge-pill {
      display: inline-flex; align-items: center;
      padding: 3px 8px; border-radius: 999px;
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .badge-pill.free { background: rgba(113,113,122,0.15); color: var(--text-muted); }
    .badge-pill.pro { background: rgba(99,102,241,0.12); color: var(--purple-light); }
    .badge-pill.custom { background: rgba(245,158,11,0.1); color: var(--yellow); }
    .badge-pill.user { background: rgba(113,113,122,0.1); color: var(--text-dim); }
    .badge-pill.admin { background: rgba(239,68,68,0.1); color: #fca5a5; }
    .badge-pill.verified { background: rgba(34,197,94,0.1); color: var(--green); }
    .badge-pill.unverified { background: rgba(113,113,122,0.1); color: var(--text-dim); }

    .inline-select {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.75rem;
      font-family: inherit; padding: 4px 8px; cursor: pointer;
      outline: none; transition: border-color 0.15s;
    }

    .inline-select:focus { border-color: var(--purple); }

    .btn-update {
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25);
      border-radius: 6px; color: var(--purple-light); cursor: pointer;
      font-size: 0.72rem; font-family: inherit; font-weight: 600; padding: 4px 10px;
      transition: all 0.15s;
    }

    .btn-update:hover { background: rgba(99,102,241,0.2); }

    /* ── AUDIT LOG ── */
    .audit-list { }
    .audit-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }

    .audit-item:last-child { border-bottom: none; }
    .audit-item:hover { background: rgba(255,255,255,0.02); }

    .audit-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    }

    .audit-dot.login { background: var(--green); }
    .audit-dot.failed { background: var(--red); }
    .audit-dot.admin { background: var(--purple); }
    .audit-dot.system { background: var(--yellow); }
    .audit-dot.default { background: var(--text-dim); }

    .audit-action { font-size: 0.8rem; font-weight: 500; color: var(--text); font-family: monospace; }
    .audit-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
    .audit-time { margin-left: auto; font-size: 0.68rem; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }

    /* ── EMPTY / LOADING ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--text-muted); font-size: 0.85rem;
    }

    .loading-rows td {
      padding: 14px 16px;
    }

    .skeleton {
      height: 14px; background: var(--bg-3); border-radius: 4px;
      animation: shimmer 1.2s ease infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px;
      font-size: 0.8rem; color: var(--text); font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: none; align-items: center; gap: 10px;
      max-width: 340px;
      animation: slideIn 0.2s ease;
    }

    #toast.show { display: flex; }
    #toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    #toast.success { border-color: rgba(34,197,94,0.3); color: #86efac; }

    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ── VISITOR CHART ── */
    .chart-container {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .chart-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }

    .chart-title { font-size: 0.875rem; font-weight: 600; color: var(--text); }
    .chart-subtitle { font-size: 0.7rem; color: var(--text-muted); }

    .bar-chart {
      display: flex; align-items: flex-end; gap: 6px;
      height: 140px; padding-top: 8px;
    }

    .bar-col {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 6px; height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%; min-height: 2px;
      background: linear-gradient(180deg, var(--cyan), rgba(6,182,212,0.4));
      border-radius: 4px 4px 0 0;
      transition: height 0.6s ease;
      position: relative;
    }

    .bar:hover { filter: brightness(1.3); }

    .bar-label {
      font-size: 0.58rem; color: var(--text-dim);
      writing-mode: horizontal-tb;
      white-space: nowrap;
    }

    .bar-value {
      font-size: 0.6rem; color: var(--text-muted); font-weight: 600;
    }

    /* ── TOP PAGES ── */
    .page-bar-wrap {
      height: 6px; background: var(--bg-3); border-radius: 3px;
      overflow: hidden; min-width: 80px; flex: 1;
    }

    .page-bar {
      height: 100%; background: var(--cyan); border-radius: 3px;
      transition: width 0.6s ease;
    }

    .page-path {
      font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
      font-size: 0.8rem; color: var(--text); font-weight: 500;
    }

    .page-views-count {
      font-size: 0.75rem; color: var(--text-muted); font-weight: 600;
      white-space: nowrap;
    }

    .top-page-row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }

    .top-page-row:last-child { border-bottom: none; }
    .top-page-row:hover { background: rgba(255,255,255,0.02); }

    .top-page-rank {
      font-size: 0.7rem; font-weight: 700; color: var(--text-dim);
      width: 20px; text-align: center; flex-shrink: 0;
    }

    /* ── AUTH GATE ── */
    #authGate {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 0.85rem; color: var(--text-muted);
    }

    .auth-gate-inner { text-align: center; }
    .auth-gate-inner .spinner { width: 28px; height: 28px; margin: 0 auto 12px; }

    .spinner {
      border: 2px solid var(--bg-3); border-top-color: var(--purple);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 0px; }
      .sidebar { display: none; }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- Auth Gate -->
<div id="authGate">
  <div class="auth-gate-inner">
    <div class="spinner"></div>
    <div>Verifying admin session…</div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <span class="brand-name">NexaLeadAi</span>
    </div>
    <span class="brand-label">Superadmin</span>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Overview</div>
    <button class="nav-item active" onclick="navigate('overview', this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>

    <div class="nav-section-label" style="margin-top:12px">Management</div>
    <button class="nav-item" onclick="navigate('users', this)">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </button>
    <button class="nav-item" onclick="navigate('visitors', this)">
      <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Visitors
    </button>
    <button class="nav-item" onclick="navigate('audit', this)">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Audit Log
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-pill">
      <div class="admin-avatar" id="adminInitial">S</div>
      <div class="admin-info">
        <div class="admin-email" id="adminEmail">Loading…</div>
        <div class="admin-role">Superadmin</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </div>
</aside>

<!-- Main Content -->
<main class="main">
  <!-- Topbar -->
  <header class="topbar">
    <span class="topbar-title" id="pageTitle">Dashboard Overview</span>
    <div class="topbar-badge">
      <div class="live-dot"></div>
      Live
    </div>
    <button class="btn-refresh" id="refreshBtn" onclick="refreshCurrent()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </header>

  <!-- ── PAGE: OVERVIEW ── -->
  <div class="page active" id="page-overview">
    <div class="stats-grid" id="statsGrid">
      <!-- Filled by JS -->
      <div class="stat-card purple"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card green"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card blue"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card yellow"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card cyan"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
    </div>

    <div class="section-header">
      <span class="section-title">Plan Distribution</span>
    </div>
    <div class="plan-grid" id="planGrid">
      <div class="plan-card free"><div class="plan-name">Free</div><div class="plan-count skeleton" style="width:40px;height:24px;border-radius:4px;display:block"></div><div class="plan-bar-wrap"><div class="plan-bar" style="width:0%"></div></div></div>
      <div class="plan-card pro"><div class="plan-name">Pro</div><div class="plan-count skeleton" style="width:40px;height:24px;border-radius:4px;display:block"></div><div class="plan-bar-wrap"><div class="plan-bar" style="width:0%"></div></div></div>
      <div class="plan-card custom"><div class="plan-name">Custom</div><div class="plan-count skeleton" style="width:40px;height:24px;border-radius:4px;display:block"></div><div class="plan-bar-wrap"><div class="plan-bar" style="width:0%"></div></div></div>
    </div>

    <div class="section-header">
      <span class="section-title">Recent Activity</span>
      <span class="section-count" id="recentCount">–</span>
    </div>
    <div class="table-wrap">
      <div class="audit-list" id="recentAudit">
        <div class="empty-state"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div>Loading…</div>

  <!-- ── PAGE: USERS ── -->
  <div class="page" id="page-users">
    <div class="table-wrap">
      <div class="table-toolbar">
        <input class="search-box" type="search" placeholder="Search by name or email…" id="userSearch" oninput="debounceSearch()" />
        <div class="toolbar-right">
          <span class="page-info" id="userPageInfo">–</span>
          <button class="btn-sm" id="userPrevBtn" onclick="usersPage--; loadUsers()" disabled>← Prev</button>
          <button class="btn-sm" id="userNextBtn" onclick="usersPage++; loadUsers()" disabled>Next →</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Verified</th>
            <th>Plan</th>
            <th>Role</th>
            <th>Leads Used</th>
            <th>Last Login</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr class="loading-rows"><td colspan="8"><div class="skeleton"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── PAGE: VISITORS ── -->
  <div class="page" id="page-visitors">
    <div class="stats-grid" id="visitorStatsGrid">
      <div class="stat-card cyan"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card green"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card blue"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
      <div class="stat-card purple"><div class="skeleton" style="width:50%;margin-bottom:12px"></div><div class="skeleton" style="width:30%;height:28px"></div></div>
    </div>

    <div class="chart-container" id="visitorChart">
      <div class="empty-state"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div>Loading chart…</div>
    </div>

    <div class="section-header">
      <span class="section-title">Top Pages</span>
      <span class="section-count" id="topPagesCount">–</span>
    </div>
    <div class="table-wrap">
      <div id="topPagesList">
        <div class="empty-state"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div>Loading…</div>
      </div>
    </div>

  <!-- ── PAGE: AUDIT ── -->
  <div class="page" id="page-audit">
    <div class="table-wrap">
      <div class="table-toolbar">
        <span class="section-title">Audit Log</span>
        <div class="toolbar-right">
          <span class="page-info" id="auditPageInfo">–</span>
          <button class="btn-sm" id="auditPrevBtn" onclick="auditPage--; loadAudit()" disabled>← Prev</button>
          <button class="btn-sm" id="auditNextBtn" onclick="auditPage++; loadAudit()" disabled>Next →</button>
        </div>
      </div>
      <div class="audit-list" id="auditList">
        <div class="empty-state"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div>Loading…</div>
      </div>
    </div>
  </div>
</main>

<!-- Toast -->
<div id="toast"></div>

<script>
  // ── State ──
  let currentPage = 'overview';
  let usersPage = 1;
  let auditPage = 1;
  let usersTotal = 0;
  let auditTotal = 0;
  const PAGE_SIZE = 20;
  let searchTimer = null;
  let adminUser = null;

  // ── Init ──
  async function init() {
    // Primary: read admin user from sessionStorage (set by login page on success)
    const stored = sessionStorage.getItem('superadmin_user');
    if (stored) {
      try {
        adminUser = JSON.parse(stored);
      } catch { adminUser = null; }
    }

    // Fallback: try the verify API if sessionStorage is empty (e.g. direct navigation)
    if (!adminUser) {
      try {
        const res = await fetch('/api/superadmin/verify', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          adminUser = data.user;
          sessionStorage.setItem('superadmin_user', JSON.stringify(adminUser));
        }
      } catch { /* silent — server already guards this page */ }
    }

    // If still no user info, show a placeholder (server already verified the session)
    if (!adminUser) {
      adminUser = { email: 'Admin', role: 'admin' };
    }

    document.getElementById('adminEmail').textContent = adminUser.email || 'Admin';
    document.getElementById('adminInitial').textContent = (adminUser.email || 'A')[0].toUpperCase();
    document.getElementById('authGate').style.display = 'none';
    loadOverview();
  }

  // ── Navigation ──
  function navigate(page, btn) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    currentPage = page;

    const titles = { overview: 'Dashboard Overview', users: 'User Management', visitors: 'Website Visitors', audit: 'Audit Log' };
    document.getElementById('pageTitle').textContent = titles[page] || page;

    if (page === 'overview') loadOverview();
    else if (page === 'users') loadUsers();
    else if (page === 'visitors') loadVisitors();
    else if (page === 'audit') loadAudit();
  }

  function refreshCurrent() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 600);
    if (currentPage === 'overview') loadOverview();
    else if (currentPage === 'users') loadUsers();
    else if (currentPage === 'visitors') loadVisitors();
    else if (currentPage === 'audit') loadAudit();
  }

  // ── API helper ──
  async function api(path) {
    const res = await fetch(path, { credentials: 'include' });
    if (res.status === 401 || res.status === 403) {
      window.location.href = '/superadmin';
      return null;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  // ── Overview ──
  async function loadOverview() {
    try {
      const [stats, auditData, visitorData] = await Promise.all([
        api('/api/admin/stats'),
        api('/api/admin/audit?page=1&pageSize=10'),
        api('/api/admin/visitors').catch(() => null),
      ]);
      if (!stats || !auditData) return;
      renderStats(stats, visitorData);
      renderPlanGrid(stats);
      renderRecentAudit(auditData.logs);
    } catch (e) {
      toast('Failed to load dashboard stats', 'error');
    }
  }

  function renderStats(s, v) {
    const visitorCard = v ? `
      <div class="stat-card cyan">
        <div class="stat-icon cyan"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="stat-label">Website Visitors</div>
        <div class="stat-value">${(v.todayViews || 0).toLocaleString()}</div>
        <div class="stat-sub">${(v.totalViews || 0).toLocaleString()} total · ${(v.uniqueVisitorsToday || 0)} unique today</div>
      </div>` : '';
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card purple">
        <div class="stat-icon purple"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="stat-label">Total Users</div>
        <div class="stat-value">${s.users.total}</div>
        <div class="stat-sub">+${s.users.newLast7Days} this week</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon green"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div class="stat-label">Verified Users</div>
        <div class="stat-value">${s.users.verified}</div>
        <div class="stat-sub">${s.users.unverified} unverified</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon blue"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.73a16 16 0 0 0 6.27 6.27l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.92 16.92z"/></svg></div>
        <div class="stat-label">Total Leads</div>
        <div class="stat-value">${s.leads.total.toLocaleString()}</div>
        <div class="stat-sub">${s.leads.last30Days} in last 30d</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-icon yellow"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg></div>
        <div class="stat-label">Lead Lists</div>
        <div class="stat-value">${s.leads.lists}</div>
        <div class="stat-sub">${s.leads.totalUsed.toLocaleString()} total used</div>
      </div>
      ${visitorCard}
      <div class="stat-card cyan">
        <div class="stat-icon cyan"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="stat-label">Audit Events</div>
        <div class="stat-value">${s.audit.total.toLocaleString()}</div>
        <div class="stat-sub">${s.audit.last7Days} in last 7d</div>
      </div>
      ${s.users.locked > 0 ? `
      <div class="stat-card red">
        <div class="stat-icon red"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div class="stat-label">Locked Accounts</div>
        <div class="stat-value">${s.users.locked}</div>
        <div class="stat-sub">Brute-force lockout</div>
      </div>` : `
      <div class="stat-card red">
        <div class="stat-icon red"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div class="stat-label">Admins</div>
        <div class="stat-value">${s.users.admins}</div>
        <div class="stat-sub">No locked accounts</div>
      </div>`}
    `;
  }

  function renderPlanGrid(s) {
    const plans = s.plans || {};
    const free = plans.free || 0;
    const pro = plans.pro || 0;
    const custom = plans.custom || 0;
    const total = Math.max(free + pro + custom, 1);
    document.getElementById('planGrid').innerHTML = `
      <div class="plan-card free">
        <div class="plan-name">Free</div>
        <div class="plan-count">${free}</div>
        <div class="plan-bar-wrap"><div class="plan-bar" style="width:${(free/total*100).toFixed(1)}%"></div></div>
      </div>
      <div class="plan-card pro">
        <div class="plan-name">Pro</div>
        <div class="plan-count">${pro}</div>
        <div class="plan-bar-wrap"><div class="plan-bar" style="width:${(pro/total*100).toFixed(1)}%"></div></div>
      </div>
      <div class="plan-card custom">
        <div class="plan-name">Custom</div>
        <div class="plan-count">${custom}</div>
        <div class="plan-bar-wrap"><div class="plan-bar" style="width:${(custom/total*100).toFixed(1)}%"></div></div>
      </div>
    `;
  }

  function renderRecentAudit(logs) {
    document.getElementById('recentCount').textContent = `${logs.length} recent`;
    if (!logs.length) {
      document.getElementById('recentAudit').innerHTML = '<div class="empty-state">No audit events yet.</div>';
      return;
    }
    document.getElementById('recentAudit').innerHTML = logs.map(log => renderAuditItem(log)).join('');
  }

  // ── Users ──
  async function loadUsers() {
    const search = document.getElementById('userSearch')?.value?.trim() || '';
    const tbody = document.getElementById('usersBody');
    tbody.innerHTML = '<tr class="loading-rows"><td colspan="8"><div class="skeleton"></div></td></tr>';

    try {
      const url = `/api/admin/users?page=${usersPage}&pageSize=${PAGE_SIZE}${search ? `&search=${encodeURIComponent(search)}` : ''}`;
      const data = await api(url);
      if (!data) return;

      usersTotal = data.total;
      const totalPages = Math.ceil(usersTotal / PAGE_SIZE);
      document.getElementById('userPageInfo').textContent = `Page ${usersPage} of ${totalPages} (${usersTotal} users)`;
      document.getElementById('userPrevBtn').disabled = usersPage <= 1;
      document.getElementById('userNextBtn').disabled = usersPage >= totalPages;

      if (!data.users.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state">No users found.</div></td></tr>';
        return;
      }

      tbody.innerHTML = data.users.map(u => `
        <tr id="row-${u.id}">
          <td>
            <div class="user-cell">
              <div class="user-avatar">${(u.name || u.email)[0].toUpperCase()}</div>
              <div>
                <div class="user-name">${esc(u.name || '—')}</div>
                <div class="user-email">${esc(u.email)}</div>
              </div>
            </div>
          </td>
          <td><span class="badge-pill ${u.emailVerified ? 'verified' : 'unverified'}">${u.emailVerified ? '✓ Yes' : 'No'}</span></td>
          <td><span class="badge-pill ${u.plan}">${u.plan}</span></td>
          <td><span class="badge-pill ${u.role}">${u.role}</span></td>
          <td>${u.leadsUsed ?? 0}</td>
          <td>${u.lastLoginAt ? timeAgo(u.lastLoginAt) : '—'}</td>
          <td>${fmtDate(u.createdAt)}</td>
          <td>
            <div style="display:flex;gap:6px;align-items:center">
              <select class="inline-select" id="plan-${u.id}">
                <option value="free" ${u.plan === 'free' ? 'selected' : ''}>Free</option>
                <option value="pro" ${u.plan === 'pro' ? 'selected' : ''}>Pro</option>
                <option value="custom" ${u.plan === 'custom' ? 'selected' : ''}>Custom</option>
              </select>
              <select class="inline-select" id="role-${u.id}">
                <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
              <button class="btn-update" onclick="updateUser('${u.id}')">Save</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state">Failed to load users.</div></td></tr>';
      toast('Failed to load users', 'error');
    }
  }

  async function updateUser(id) {
    const plan = document.getElementById(`plan-${id}`)?.value;
    const role = document.getElementById(`role-${id}`)?.value;
    try {
      const res = await fetch(`/api/admin/users/${id}`, {
        method: 'PATCH',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan, role }),
      });
      const data = await res.json();
      if (res.ok) {
        toast(`User updated → ${plan} / ${role}`, 'success');
        loadUsers();
      } else {
        toast(data.error || 'Update failed', 'error');
      }
    } catch {
      toast('Network error', 'error');
    }
  }

  function debounceSearch() {
    clearTimeout(searchTimer);
    usersPage = 1;
    searchTimer = setTimeout(loadUsers, 300);
  }

  // ── Audit ──
  async function loadAudit() {
    document.getElementById('auditList').innerHTML = '<div class="empty-state"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div>Loading…</div>';
    try {
      const data = await api(`/api/admin/audit?page=${auditPage}&pageSize=30`);
      if (!data) return;

      auditTotal = data.total;
      const totalPages = Math.ceil(auditTotal / 30);
      document.getElementById('auditPageInfo').textContent = `Page ${auditPage} of ${totalPages} (${auditTotal} events)`;
      document.getElementById('auditPrevBtn').disabled = auditPage <= 1;
      document.getElementById('auditNextBtn').disabled = auditPage >= totalPages;

      if (!data.logs.length) {
        document.getElementById('auditList').innerHTML = '<div class="empty-state">No audit events yet.</div>';
        return;
      }

      document.getElementById('auditList').innerHTML = data.logs.map(log => renderAuditItem(log)).join('');
    } catch (e) {
      toast('Failed to load audit log', 'error');
    }
  }

  function renderAuditItem(log) {
    const dotClass = log.action.includes('success') ? 'login'
      : log.action.includes('failed') || log.action.includes('bad') ? 'failed'
      : log.action.includes('admin') || log.action.includes('superadmin') ? 'admin'
      : 'default';

    return `
      <div class="audit-item">
        <div class="audit-dot ${dotClass}"></div>
        <div style="flex:1;min-width:0">
          <div class="audit-action">${esc(log.action)}</div>
          <div class="audit-meta">
            ${log.user?.email ? `<strong>${esc(log.user.email)}</strong> · ` : ''}
            ${log.ip ? `IP: ${esc(log.ip)}` : ''}
            ${log.metadata ? ` · ${tryParseMetadata(log.metadata)}` : ''}
          </div>
        </div>
        <div class="audit-time">${timeAgo(log.createdAt)}</div>
      </div>
    `;
  }

  // ── Visitors ──
  async function loadVisitors() {
    try {
      const data = await api('/api/admin/visitors');
      if (!data) return;
      renderVisitorStats(data);
      renderVisitorChart(data.dailyTrend);
      renderTopPages(data.topPages);
    } catch (e) {
      toast('Failed to load visitor data', 'error');
    }
  }

  function renderVisitorStats(v) {
    document.getElementById('visitorStatsGrid').innerHTML = `
      <div class="stat-card cyan">
        <div class="stat-icon cyan"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="stat-label">Total Page Views</div>
        <div class="stat-value">${(v.totalViews || 0).toLocaleString()}</div>
        <div class="stat-sub">All time</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon green"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div class="stat-label">Today</div>
        <div class="stat-value">${(v.todayViews || 0).toLocaleString()}</div>
        <div class="stat-sub">${(v.uniqueVisitorsToday || 0)} unique visitors</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon blue"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
        <div class="stat-label">Last 7 Days</div>
        <div class="stat-value">${(v.last7DaysViews || 0).toLocaleString()}</div>
        <div class="stat-sub">${(v.uniqueVisitors7Days || 0)} unique visitors</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-icon purple"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="stat-label">Last 30 Days</div>
        <div class="stat-value">${(v.last30DaysViews || 0).toLocaleString()}</div>
        <div class="stat-sub">Monthly views</div>
      </div>
    `;
  }

  function renderVisitorChart(trend) {
    if (!trend || !trend.length) {
      document.getElementById('visitorChart').innerHTML = '<div class="empty-state">No visitor data yet.</div>';
      return;
    }
    const maxViews = Math.max(...trend.map(d => d.views), 1);
    const bars = trend.map(d => {
      const pct = Math.max((d.views / maxViews) * 100, 1.5);
      const dayLabel = new Date(d.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `
        <div class="bar-col">
          <div class="bar-value">${d.views}</div>
          <div class="bar" style="height:${pct}%" title="${dayLabel}: ${d.views} views"></div>
          <div class="bar-label">${dayLabel}</div>
        </div>
      `;
    }).join('');

    document.getElementById('visitorChart').innerHTML = `
      <div class="chart-header">
        <div>
          <div class="chart-title">Daily Page Views</div>
          <div class="chart-subtitle">Last 14 days</div>
        </div>
      </div>
      <div class="bar-chart">${bars}</div>
    `;
  }

  function renderTopPages(pages) {
    document.getElementById('topPagesCount').textContent = `${pages.length} pages`;
    if (!pages || !pages.length) {
      document.getElementById('topPagesList').innerHTML = '<div class="empty-state">No page data yet.</div>';
      return;
    }
    const maxViews = pages[0]?.views || 1;
    document.getElementById('topPagesList').innerHTML = pages.map((p, i) => {
      const pct = (p.views / maxViews * 100).toFixed(1);
      return `
        <div class="top-page-row">
          <div class="top-page-rank">${i + 1}</div>
          <div class="page-path">${esc(p.path)}</div>
          <div class="page-bar-wrap"><div class="page-bar" style="width:${pct}%"></div></div>
          <div class="page-views-count">${p.views.toLocaleString()} views</div>
        </div>
      `;
    }).join('');
  }

  // ── Logout ──
  async function logout() {
    sessionStorage.removeItem('superadmin_user');
    await fetch('/api/superadmin/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/superadmin';
  }

  // ── Helpers ──
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function timeAgo(dateStr) {
    const d = new Date(dateStr);
    const diff = Date.now() - d.getTime();
    const secs = Math.floor(diff / 1000);
    if (secs < 60) return `${secs}s ago`;
    if (secs < 3600) return `${Math.floor(secs/60)}m ago`;
    if (secs < 86400) return `${Math.floor(secs/3600)}h ago`;
    return `${Math.floor(secs/86400)}d ago`;
  }

  function fmtDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function tryParseMetadata(raw) {
    try {
      const obj = JSON.parse(raw);
      return Object.entries(obj).map(([k,v]) => `${k}: ${v}`).join(', ');
    } catch { return raw; }
  }

  let toastTimer;
  function toast(msg, type = 'default') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Start ──
  init();
</script>
</body>
</html>
