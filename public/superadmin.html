<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadGenPilot — Superadmin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 18px;
      height: 18px;
      color: #fff;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .brand-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: #f4f4f5;
    }

    .brand-sub {
      font-size: 0.7rem;
      color: #71717a;
      font-weight: 400;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.25);
      color: #fbbf24;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      margin-bottom: 16px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #fbbf24;
      border-radius: 50%;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f4f4f5;
      margin-bottom: 6px;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #71717a;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: #27272a;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.875rem;
      font-family: inherit;
      color: #f4f4f5;
      transition: border-color 0.15s;
      outline: none;
    }

    input::placeholder { color: #52525b; }

    input:focus { border-color: #6366f1; }

    input[type="password"] { letter-spacing: 0.1em; }

    .secret-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .secret-row input { flex: 1; }

    .toggle-secret {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #a1a1aa;
      cursor: pointer;
      padding: 8px 10px;
      font-size: 0.75rem;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .toggle-secret:hover { background: #3f3f46; }

    .btn {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:hover { background: #5b5ef1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-box {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
      margin-top: 16px;
      display: none;
    }

    .success-box {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
      margin-top: 16px;
      display: none;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.7rem;
      color: #3f3f46;
      text-align: center;
      line-height: 1.5;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div>
        <div class="brand-text">LeadGenPilot</div>
        <div class="brand-sub">Internal Admin Portal</div>
      </div>
    </div>

    <div class="badge">Superadmin Access</div>
    <h1>Admin Sign In</h1>
    <p class="subtitle">This page is restricted to authorized administrators only. All access attempts are logged.</p>

    <div class="divider"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="admin@yourdomain.com" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <div class="form-group">
        <label for="secret">Superadmin Secret</label>
        <div class="secret-row">
          <input id="secret" type="password" placeholder="SUPERADMIN_SECRET" required autocomplete="off" />
          <button type="button" class="toggle-secret" onclick="toggleSecret()">Show</button>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Sign in to Admin Panel</button>

      <div class="error-box" id="errorBox"></div>
      <div class="success-box" id="successBox"></div>
    </form>

    <p class="footer-note">All login attempts are recorded in the audit log.<br />Unauthorized access is prohibited.</p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');

    function setError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    function setSuccess(msg) {
      successBox.textContent = msg;
      successBox.style.display = 'block';
      errorBox.style.display = 'none';
    }

    function clearMessages() {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
    }

    function toggleSecret() {
      const secretInput = document.getElementById('secret');
      const btn = document.querySelector('.toggle-secret');
      if (secretInput.type === 'password') {
        secretInput.type = 'text';
        btn.textContent = 'Hide';
      } else {
        secretInput.type = 'password';
        btn.textContent = 'Show';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const secret = document.getElementById('secret').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch('/api/superadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password, secret }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          setSuccess('Login successful! Redirecting to admin dashboard...');
          // Store admin info so dashboard can use it without re-fetching
          sessionStorage.setItem('superadmin_user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = '/superadmin/dashboard';
          }, 400);
        } else {
          setError(data.error || 'Login failed. Please check your credentials and secret.');
        }
      } catch (err) {
        setError('Network error. Please check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign in to Admin Panel';
      }
    });
  </script>
</body>
</html>
