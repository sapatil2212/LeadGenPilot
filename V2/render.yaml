services:
  - type: web
    name: leadgenpilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Protects all /api routes. Generate a strong random value in the
      # Render dashboard (Environment > Generate).
      - key: API_KEY
        generateValue: true
      # Restrict to your dashboard origin(s) in production.
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # Phase 7: a separate process owns durable campaign leases. Scale this
  # independently from the web service; all replicas coordinate through MySQL.
  - type: worker
    name: leadgenpilot-campaign-worker
    runtime: docker
    plan: starter
    dockerCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Leave WORKER_ID unset to use the process UUID generated by src/worker.ts.
      # Explicit IDs are only appropriate when every replica receives a unique value.
      - key: CAMPAIGN_WORKER_POLL_MS
        value: 2000
      - key: LOG_LEVEL
        value: info
