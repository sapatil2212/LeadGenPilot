<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>LeadGenPilot - Maps Automation Agent</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Leaflet drives the map, markers and radius overlays. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />

    <!--
      OpenFreeMap serves keyless vector tiles. The bridge keeps the existing
      Leaflet interaction code while MapLibre renders the vector basemap below
      it. Versions and integrity hashes are pinned so an upstream release cannot
      silently change executable code in this page.
    -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha256-qx5w1Z7EBGW65+cDDaLzzPKBM/1QLmK9WY7vut/XpzI=" crossorigin="anonymous" />

    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" integrity="sha256-Hmz4yz61/ZCYeaob82o4P7UGyaWy27+rq85lopTdH8s=" crossorigin="anonymous"></script>
